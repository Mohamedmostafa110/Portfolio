<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohamed Mostafa — Full-Stack Engineer & Product Builder</title>
    <meta
      name="description"
      content="Mohamed Mostafa is a Full-Stack Engineer who turns ideas into production-ready digital products — interfaces, APIs, databases, and deployment."
    />
    <link rel="canonical" href="https://mohamedmostafa.dev/" />
    <meta name="theme-color" content="#0B132B" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohamed Mostafa — Full-Stack Engineer & Product Builder" />
    <meta
      property="og:description"
      content="I build modern digital products from idea to production — interfaces, backend, databases, and deployment."
    />
    <meta property="og:url" content="https://mohamedmostafa.dev/" />
    <meta property="og:image" content="https://mohamedmostafa.dev/og-image.png" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Mostafa — Full-Stack Engineer & Product Builder" />
    <meta
      name="twitter:description"
      content="I build modern digital products from idea to production."
    />
    <meta name="twitter:image" content="https://mohamedmostafa.dev/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash on first paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored ? stored === "dark" : prefersDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* storage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
